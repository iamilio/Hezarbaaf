name: core-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build core (netstandard2.0)
        run: dotnet build src/MasonryCore -c Release
      - name: Run core tests
        run: dotnet run --project tests/MasonryCore.Tests -c Release -p:CoreTfm=net8.0
